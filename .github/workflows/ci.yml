name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-15 ships Xcode 16 (Swift 6.x) as its default toolchain. The default
    # on macos-14 is Swift 5.10, which cannot build a swift-tools-version:6.0
    # package (the previous CI failure).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift run UsageKitTests

      - name: Build release bundle
        run: ./Scripts/make-app.sh
